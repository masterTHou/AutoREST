[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autorest"
version = "4.0.0"
description = "AutoREST — AI-Driven REST Electronic Structure Automation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Zhehan Tong"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["quantum-chemistry", "electronic-structure", "dft", "gw-bse", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/masterTHou/AutoREST"
Repository = "https://github.com/masterTHou/AutoREST"
Issues = "https://github.com/masterTHou/AutoREST/issues"

[project.scripts]
autorest = "autorest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autorest", "autorest.*"]
# ─── Frequency + Thermochemistry ─────────────────────────────────
[frequency]
template = """
[ctrl]
num_threads = {num_threads}
print_level = {print_level}
job_type = "energy"
xc = "{xc}"
{empirical_dispersion}
basis_path = "{basis_path}"
{auxbas_path}
eri_type = "ri-v"
charge = {charge}
spin = {spin}
spin_polarization = {spin_polarization}

[geom]
name = "{system_name}"
unit = "{geometry_unit}"
position = \"\"\"
{geometry}
\"\"\"

[hessian]
frequencies = true

[thermo]
temperature = {thermo_temperature}
pressure = {thermo_pressure}
symmetry_number = {thermo_symmetry_number}
{thermo_electronic_energy}
ilowfreq = {thermo_ilowfreq}
"""

# ─── G₀W₀ Quasiparticle Energy ──────────────────────────────────
[gw]
template = """
[ctrl]
num_threads = {num_threads}
print_level = {print_level}
job_type = "energy"
xc = "{xc}"
basis_path = "{basis_path}"
auxbas_path = "{auxbas_path}"
eri_type = "ri-v"
use_ri_symm = true
charge = {charge}
spin = {spin}
spin_polarization = {spin_polarization}

[geom]
name = "{system_name}"
unit = "{geometry_unit}"
position = \"\"\"
{geometry}
\"\"\"

[quasiparticle_methods]
gw_or_bse = "gw"
gw_scheme = "{gw_scheme}"
scgw = "{scgw}"
use_low_rank_contour = {use_low_rank_contour}
{gw_threshold}
"""


# AutoREST REST Input Card Templates
# ====================================
# Each template uses {placeholder} syntax for parameter substitution.
# These are the canonical templates; use InputGenerator to fill them.

# ─── Single-Point Energy ─────────────────────────────────────────
[energy]
template = """
[ctrl]
num_threads = {num_threads}
print_level = {print_level}
job_type = "energy"
xc = "{xc}"
{empirical_dispersion}
basis_path = "{basis_path}"
{auxbas_path}
eri_type = "ri-v"
charge = {charge}
spin = {spin}
spin_polarization = {spin_polarization}

[geom]
name = "{system_name}"
unit = "{geometry_unit}"
position = \"\"\"
{geometry}
\"\"\"
"""

# ─── Geometry Optimization ───────────────────────────────────────
[optimization]
template = """
[ctrl]
num_threads = {num_threads}
print_level = {print_level}
job_type = "opt"
opt_engine = "geometric-pyo3"
xc = "{xc}"
{empirical_dispersion}
basis_path = "{basis_path}"
{auxbas_path}
eri_type = "ri-v"
charge = {charge}
spin = {spin}
spin_polarization = {spin_polarization}

[geom]
name = "{system_name}"
unit = "{geometry_unit}"
position = \"\"\"
{geometry}
\"\"\"

[geometric_pyo3]
maxiter = {opt_maxiter}
converge_energy = {opt_converge_energy}
converge_grms = {opt_converge_grms}
"""

